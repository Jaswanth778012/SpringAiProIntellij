spring.application.name=SpringAiProIntellij

server.port=8085

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.project-id = ${GOOGLE_GENAI_PROJECT_ID}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.options.temperature=0.7

spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#spring.datasource.url = jdbc:mysql://localhost:3306/spring_ai
#spring.datasource.username = root
#spring.datasource.password = toor
#spring.ai.chat.memory.repository.jdbc.initialize-schema = ALWAYS

spring.datasource.url = jdbc:mariadb://localhost:3308/springai
spring.datasource.username = root
spring.datasource.password = toor

spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type= COSINE
spring.ai.vectorstore.mariadb.dimensions = 3072

spring.ai.weather-api = ${WEATHER_API}